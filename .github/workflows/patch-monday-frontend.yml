name: Patch Monday frontend

on:
  push:
    branches:
      - feature/monday-leads
    paths:
      - .github/workflows/patch-monday-frontend.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/monday-leads

      - name: Patch submit handler
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = """      submit: () => {\n        this.setState({ done: true, err: '' });\n        if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });\n      },"""
          new = """      submit: async () => {\n        const s = this.state;\n        const f = s.f || {};\n        this.setState({ err: 'שולח את השאלון...' });\n        try {\n          const response = await fetch('https://gotlib-landing-api.onrender.com/api/leads', {\n            method: 'POST',\n            headers: { 'Content-Type': 'application/json' },\n            body: JSON.stringify({\n              fullName: f.fullName || '',\n              phone: f.phone || '',\n              email: f.email || '',\n              whatsapp: f.whatsapp || '',\n              org: f.org || '',\n              types: Array.isArray(s.types) ? s.types : []\n            })\n          });\n          if (!response.ok) throw new Error('submit failed');\n          this.setState({ done: true, err: '' });\n          if (typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });\n        } catch (error) {\n          console.error('Questionnaire submit failed', error);\n          this.setState({ err: 'לא הצלחנו לשלוח את השאלון. נסו שוב בעוד רגע.' });\n        }\n      },"""
          if old not in text:
              raise SystemExit('Expected submit handler not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: submit landing leads to monday api"
          git push origin feature/monday-leads
